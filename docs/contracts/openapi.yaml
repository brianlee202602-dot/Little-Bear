components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
    KbId:
      name: kb_id
      in: path
      required: true
      schema:
        type: string
    DocId:
      name: doc_id
      in: path
      required: true
      schema:
        type: string
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
    FolderId:
      name: folder_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    DepartmentId:
      name: department_id
      in: path
      required: true
      schema:
        type: string
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
    BindingId:
      name: binding_id
      in: path
      required: true
      schema:
        type: string
    ConfigKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    ConfigVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
    AuditId:
      name: audit_id
      in: path
      required: true
      schema:
        type: string
    QueryLogId:
      name: query_log_id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RequestId:
      type: string
      examples: ["req_001"]
    DebugId:
      type: string
      description: 普通用户可见的短排障码，不能反推出内部 request_id 或 trace_id。
      examples: ["dbg_4f8b3a1c9d02"]
    Timestamp:
      type: string
      format: date-time
    AnyObject:
      type: object
      additionalProperties: true
    Pagination:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
